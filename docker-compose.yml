services:
  metatox:
    build:
      context: .
      dockerfile: Dockerfile
    image: metatox:latest
    container_name: metatox
    ports:
      - "${METATOX_PORT:-8501}:8501"
    environment:
      METATOX_PORT: "8501"
      METATOX_VERBOSE: "true"
      METATOX_NATIVE_COMPILE: "true"
      METATOX_PREFETCH_IMAGES: "${METATOX_PREFETCH_IMAGES:-false}"
      APPTAINER_NO_MOUNT: "cwd,home,tmp,/etc/localtime"
      SINGULARITY_NO_MOUNT: "cwd,home,tmp,/etc/localtime"
      APPTAINER_TMPDIR: "/tmp/apptainer"
      SINGULARITY_TMPDIR: "/tmp/apptainer"
      TMPDIR: "/tmp"
      METATOX_VERIFY_APPTAINER: "${METATOX_VERIFY_APPTAINER:-true}"
      METATOX_REQUIRE_APPTAINER: "${METATOX_REQUIRE_APPTAINER:-true}"
      BIOTRANSFORMER_RUNTIME: "/var/lib/metatox/biotransformer-runtime"
      BIOTRANSFORMER_PREFER_NATIVE_JAVA: "${BIOTRANSFORMER_PREFER_NATIVE_JAVA:-1}"
    volumes:
      - ./data/input:/app/data/input
      - ./data/output:/app/data/output
      - metatox-singularity-cache:/var/lib/metatox/singularity-cache
      - metatox-biotransformer-runtime:/var/lib/metatox/biotransformer-runtime
    restart: unless-stopped
    privileged: true
    shm_size: "4gb"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    devices:
      - /dev/fuse

volumes:
  metatox-singularity-cache:
  metatox-biotransformer-runtime:
